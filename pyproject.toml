[project]
authors = [{name = "Corinne Stucker"},{name="Vivien Sainte Fare Garnot"},{name="Konrad Schindler"}]
name = "U-TILISE"
requires-python = ">= 3.10"
version = "0.1.0"
license = "MIT"
dependencies = ["setuptools", "prodict>=0.8.20,<0.9", "torchgeometry>=0.1.2,<0.2", "nestargs>=1.1.0,<2", "tensorboard>=2.20.0,<3"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.pixi.workspace]
channels = ["nvidia/label/cuda-11.8.0", "nvidia", "pytorch", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
u_tilise = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
cuda = {version = "*", channel="nvidia/label/cuda-11.8.0"}
pytorch = {channel = "pytorch", version = "*"}
torchvision = {channel = "pytorch", version = ">=0.19.1"}
pytorch-cuda = {version = "11.8.*", channel="pytorch"}
h5py = ">=3.9.0,<4"
kornia = ">=0.7.1,<0.8"
matplotlib = ">=3.9.1,<4"
numba = ">=0.59.1,<0.60"
omegaconf = ">=2.3.0,<3"
torchinfo = ">=1.8.0,<2"
tqdm = ">=4.67.1,<5"
wandb = ">=0.21.0,<0.22"
